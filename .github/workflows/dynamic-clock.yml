name: Dynamic Clock build

on:
  push:
    paths:
      - DynamicClock.zip
      - .github/workflows/dynamic-clock.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Unzip project
        run: |
          rm -rf dc && mkdir dc
          unzip -q DynamicClock.zip -d dc
          SETTINGS=$(find dc -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)
          if [ -z "$SETTINGS" ]; then echo "No settings.gradle found in zip"; find dc | head -50; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          find "$(dirname "$SETTINGS")" -maxdepth 3 | head -60

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dynamicclock-debug
          path: dc/**/build/outputs/apk/debug/*.apk
