name: Dynamic Clock build

on:
  push:
    paths:
      - DynamicClock.zip
      - .github/workflows/dynamic-clock.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          rm -rf dc && mkdir dc
          unzip -q DynamicClock.zip -d dc
          SETTINGS=$(find dc -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)
          if [ -z "$SETTINGS" ]; then echo "No settings.gradle found in zip"; find dc | head -50; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dynamicclock-apk
          path: dc/**/build/outputs/apk/debug/*.apk
